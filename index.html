<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#234f2a">
  <meta name="description" content="一个可在电脑和手机浏览器中游玩的贪吃蛇 Demo，支持触控与键盘操作。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake Demo">
  <meta property="og:title" content="Snake Demo">
  <meta property="og:description" content="一个可在电脑和手机浏览器中游玩的贪吃蛇 Demo。">
  <meta property="og:type" content="website">
  <title>Snake Demo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel">
      <div>
        <p class="eyebrow">Browser Game Demo</p>
        <h1>贪吃蛇</h1>
        <p class="description">
          先把本地游玩体验打磨好。电脑支持方向键和 WASD，手机支持按键与滑动操作。
        </p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <span>得分</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat-card">
          <span>最高分</span>
          <strong id="best-score">0</strong>
        </div>
        <div class="stat-card">
          <span>速度</span>
          <strong id="speed">1x</strong>
        </div>
      </div>

      <div class="actions">
        <button id="start-button" class="primary">开始游戏</button>
        <button id="pause-button">暂停</button>
      </div>

      <p id="status" class="status">按“开始游戏”进入第一局</p>

      <div class="tips">
        <span>电脑：方向键 / WASD / 空格暂停</span>
        <span>手机：滑动或点击下方按钮</span>
      </div>
    </section>

    <section class="game-shell">
      <div class="canvas-wrap">
        <canvas id="game" width="420" height="420" aria-label="贪吃蛇游戏画布"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <p id="overlay-kicker" class="overlay-kicker">Ready</p>
            <h2 id="overlay-title">贪吃蛇</h2>
            <p id="overlay-text">点击开始，先跑起来。</p>
          </div>
        </div>
      </div>

      <div class="control-hint">
        <span id="last-action">等待开始</span>
        <span id="streak">连续吃到 0 个</span>
      </div>

      <div class="mobile-controls" aria-label="触控方向键">
        <button type="button" data-dir="up" aria-label="向上">▲</button>
        <div class="middle-row">
          <button type="button" data-dir="left" aria-label="向左">◀</button>
          <button type="button" data-dir="down" aria-label="向下">▼</button>
          <button type="button" data-dir="right" aria-label="向右">▶</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
